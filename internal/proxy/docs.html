<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fomo.family API · Docs & playground</title>
<meta name="description" content="Free public Fomo.family API by PooTracker. Profiles, theses, leaderboards, and live WebSocket events. Interactive docs. No API key required.">
<style>
:root{color-scheme:dark;--bg:#101214;--panel:#181b1f;--line:#30353b;--muted:#a1a9b3;--text:#edf0f4;--accent:#adf5cc;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{border-bottom:1px solid var(--line);padding:18px max(24px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:750;letter-spacing:-.6px;font-size:21px}.brand span{color:var(--muted);font-size:13px;font-weight:450;margin-left:12px}nav{display:flex;gap:22px;font-size:13px}main{max-width:1280px;margin:auto;padding:44px 24px 64px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;font-weight:700}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.7px;line-height:1.12;margin:12px 0 18px}h2{letter-spacing:-.6px;margin:0;font-size:24px}p{margin:8px 0 18px}.intro{max-width:750px;color:var(--muted);font-size:17px}.badges{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 32px}.badge{border:1px solid var(--line);border-radius:24px;padding:5px 12px;font-size:12px}.badge.open{color:var(--accent);border-color:#365b46;background:#172b20}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}aside{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding-right:8px}.search,input,select{width:100%;background:#101214;border:1px solid var(--line);border-radius:7px;padding:10px 12px;color:var(--text)}.search{margin-bottom:14px}.compat{font-size:12px;display:flex;gap:8px;align-items:center;color:var(--muted)}.compat input{width:auto}.group-label{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin:22px 8px 8px}.route{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--text);padding:10px;border-radius:7px;display:flex;align-items:flex-start;gap:10px;margin:3px 0;line-height:1.4;font-size:13px}.route:hover{background:var(--panel)}.route.active{background:#1b2a22;border-color:#355a45}.method{font:600 10px/1.8 var(--mono);color:var(--accent);min-width:34px}.method.post{color:#edca91}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;min-width:0}.detail{color:var(--muted);font-size:14px;margin-top:10px}.endpoint{font:13px var(--mono);overflow-wrap:anywhere;padding:14px 0;color:var(--accent)}.section-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{font:12px var(--mono);display:block;margin-bottom:6px}.field small{color:var(--muted);font:11px system-ui}.field p{font-size:12px;color:var(--muted);margin:4px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 0}.primary,.secondary{border-radius:7px;padding:9px 16px;font-size:13px;font-weight:650;border:1px solid var(--line)}.primary{background:var(--accent);color:#11291b;border-color:var(--accent)}.secondary{background:transparent;color:var(--text)}pre{font:12px/1.7 var(--mono);background:#0e1012;border:1px solid var(--line);padding:16px;border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:460px;overflow:auto}.response-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 10px;color:var(--muted);font-size:12px}.status{color:var(--accent)}.status.error{color:#ffa8a8}.notes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.note{padding:20px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted)}.note strong{color:var(--text);display:block;margin-bottom:6px}.note p{margin:0}.headers{font:11px/1.7 var(--mono);color:var(--muted);white-space:pre-wrap;margin:0 0 10px}footer{margin-top:40px;color:var(--muted);font-size:12px}.hidden{display:none!important}code{font-family:var(--mono);font-size:.9em}.notice{border-left:2px solid var(--accent);padding-left:12px;font-size:13px;color:var(--muted);margin:20px 0}.url{font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-top:12px}@media(max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;max-height:320px;border:1px solid var(--line);border-radius:10px;padding:14px}.fields,.notes{grid-template-columns:1fr}main{padding-top:28px}.card{padding:18px}header{padding:16px 24px}.brand span{display:none}nav{gap:12px}}
.route span:last-child{font:11px/1.55 var(--mono);overflow-wrap:anywhere;min-width:0}h1{font-size:32px;letter-spacing:-1px;margin-top:0}main{padding-top:30px}.layout{grid-template-columns:340px minmax(0,1fr)}@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="brand" href="/docs">Fomo API<span>by PooTracker</span></a><nav aria-label="Links"><a href="/openapi.json">OpenAPI ↗</a><a href="https://github.com/deladevsol/fomo-api">GitHub ↗</a><a href="https://x.com/deladevsol">@deladevsol ↗</a></nav></header>
<main>
<h1>Fomo.family API</h1>
<div class="badges"><span class="badge open">● No API key required</span><span class="badge">1,000 requests / IP / 5 minutes</span></div>
<div class="layout">
<aside aria-label="Endpoints"><input class="search" id="search" type="search" placeholder="Find an endpoint…" aria-label="Find an endpoint"><label class="compat"><input id="compat" type="checkbox">Legacy routes</label><div id="routes">Loading endpoints…</div></aside>
<div>
<section class="card" aria-label="API playground">
<div class="eyebrow" id="category">Playground</div><h2 id="title">Request</h2>
<div class="endpoint" id="endpoint"></div><form id="request-form"><div class="fields" id="fields"></div><div class="actions"><button class="primary" id="send" type="submit" disabled>Try it →</button><button class="secondary" id="copy" type="button">Copy cURL</button><button class="secondary hidden" id="disconnect" type="button">Disconnect</button></div></form>
<div class="url" id="url"></div><div class="section-label">Request example</div><pre id="example">Choose an endpoint to get started.</pre>
<div class="response-bar"><span>Response</span><span class="status" id="status" role="status" aria-live="polite">Ready when you are</span></div><div class="headers" id="response-headers"></div><pre id="response" aria-label="Response body">Your response will appear here.</pre><div class="actions"><button class="secondary hidden" id="next" type="button">Next page →</button></div>
</section>
</div></div><footer><a href="https://x.com/deladevsol">@deladevsol</a> · <a href="https://pootracker.app">PooTracker</a></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let entries=[],selected,controls=[],socket,controller,generation=0,nextBefore=null;
const sample={handle:'ogle',q:'ogle',id:'',address:'',tokenAddress:''};
const shellQuote=s=>"'"+s.replaceAll("'","'\\''")+"'";
function isStream(){return selected && ['/v2/stream','/v2/ws'].includes(selected.path)}
function makeURL(){let path=selected.path;const query=new URLSearchParams();for(const {param,input} of controls){const v=input.value.trim();if(param.in==='path')path=path.replace('{'+param.name+'}',encodeURIComponent(v));else if(v)query.set(param.name,v)}const url=new URL(path,location.origin);url.search=query.toString();return url}
function updateExample(){if(!selected)return;const url=makeURL();if(isStream()){url.protocol=location.protocol==='https:'?'wss:':'ws:';$('example').textContent='Connect: '+url+'\n\nSend:\n'+JSON.stringify({type:'subscribe',subscription:{type:'all'}},null,2)}else{$('example').textContent='curl '+(selected.method==='POST'?'-X POST ':'')+shellQuote(url.toString())}$('url').textContent=url.toString();nextBefore=null;$('next').classList.add('hidden')}
function stop(){generation++;if(controller){controller.abort();controller=null}if(socket){socket.close();socket=null}$('disconnect').classList.add('hidden');$('send').disabled=false}
function choose(entry){stop();selected=entry;$('category').textContent=(entry.op.tags||['API'])[0];$('title').textContent='Request';$('endpoint').textContent=(isStream()?'WS':entry.method)+' '+entry.path;$('fields').replaceChildren();controls=[];
for(const param of entry.op.parameters||[]){const field=document.createElement('div');field.className='field';const label=document.createElement('label');label.textContent=param.name+' ';const small=document.createElement('small');small.textContent=param.required?'required':'optional';label.append(small);const input=document.createElement(param.schema?.enum?'select':'input');input.id='param-'+param.name;label.htmlFor=input.id;input.required=Boolean(param.required);if(param.schema?.enum){if(!param.required)input.add(new Option('Default',''));for(const v of param.schema.enum)input.add(new Option(v,v))}else{input.type=param.schema?.type==='integer'?'number':'text';if(param.schema?.minimum!==undefined)input.min=param.schema.minimum;if(param.schema?.maximum!==undefined)input.max=param.schema.maximum;if(param.schema?.minLength!==undefined)input.minLength=param.schema.minLength;if(param.schema?.maxLength!==undefined)input.maxLength=param.schema.maxLength;input.placeholder=param.in==='path'?'Enter '+param.name:'Optional'}input.value=String(param.example??param.schema?.default??sample[param.name]??'');input.addEventListener('input',updateExample);field.append(label,input);if(param.description){const p=document.createElement('p');p.textContent=param.description;field.append(p)}$('fields').append(field);controls.push({param,input})}
$('send').textContent=isStream()?'Connect & subscribe →':'Try it →';$('copy').textContent=isStream()?'Copy example':'Copy cURL';$('status').textContent='Ready when you are';$('status').className='status';$('response').textContent='Your response will appear here.';$('response-headers').textContent='';updateExample();renderRoutes()}
function renderRoutes(){const term=$('search').value.trim().toLowerCase();$('routes').replaceChildren();const groups=new Map();for(const entry of entries){if(entry.op.deprecated&&!$('compat').checked)continue;if(!(entry.path+' '+entry.op.summary).toLowerCase().includes(term))continue;const tag=(entry.op.tags||['API'])[0];if(!groups.has(tag))groups.set(tag,[]);groups.get(tag).push(entry)}for(const [tag,group] of groups){const label=document.createElement('div');label.className='group-label';label.textContent=tag;$('routes').append(label);for(const entry of group){const button=document.createElement('button');button.className='route'+(selected===entry?' active':'');button.setAttribute('aria-pressed',String(selected===entry));const method=document.createElement('span');method.className='method '+entry.method.toLowerCase();method.textContent=entry.path.endsWith('/stream')||entry.path.endsWith('/ws')?'WS':entry.method;const name=document.createElement('span');name.textContent=entry.path;button.append(method,name);button.onclick=()=>choose(entry);$('routes').append(button)}}if(!groups.size)$('routes').textContent='No matches.'}
async function send(){if(!selected||!$('request-form').reportValidity())return;stop();const run=generation;const url=makeURL();$('send').disabled=true;$('next').classList.add('hidden');$('status').className='status';$('status').textContent=isStream()?'Connecting…':'Sending…';$('response-headers').textContent='';
if(isStream()){url.protocol=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(url);socket=ws;let messages=[];$('disconnect').classList.remove('hidden');ws.onopen=()=>{if(run!==generation)return;$('status').textContent='Connected · subscribed to all theses';ws.send(JSON.stringify({type:'subscribe',subscription:{type:'all'}}))};ws.onmessage=e=>{if(run!==generation)return;try{messages.push(JSON.stringify(JSON.parse(e.data),null,2))}catch{messages.push(String(e.data))}messages=messages.slice(-50);$('response').textContent=messages.join('\n\n')};ws.onerror=()=>{if(run!==generation)return;$('status').textContent='Connection failed';$('status').classList.add('error')};ws.onclose=()=>{if(run!==generation)return;$('status').textContent='Disconnected';$('send').disabled=false;$('disconnect').classList.add('hidden')};return}
const started=performance.now();const abort=new AbortController();controller=abort;const timer=setTimeout(()=>abort.abort(),35000);try{const response=await fetch(url,{method:selected.method,redirect:'error',credentials:'omit',signal:abort.signal});const raw=await response.text();if(run!==generation)return;let data;try{data=JSON.parse(raw);$('response').textContent=JSON.stringify(data,null,2)}catch{$('response').textContent=raw}$('status').textContent=response.status+' '+response.statusText+' · '+Math.round(performance.now()-started)+' ms';$('status').classList.toggle('error',!response.ok);$('response-headers').textContent=['X-Cache-Status','X-RateLimit-Limit','X-RateLimit-Remaining','X-RateLimit-Reset','Retry-After'].filter(h=>response.headers.has(h)).map(h=>h+': '+response.headers.get(h)).join('\n');nextBefore=response.ok&&data?.hasMore&&data?.nextBefore?data.nextBefore:null;if(nextBefore&&controls.some(c=>c.param.name==='before'))$('next').classList.remove('hidden')}catch(error){if(run!==generation)return;$('status').textContent=error.name==='AbortError'?'Request timed out':'Request failed';$('status').classList.add('error');$('response').textContent=String(error)}finally{clearTimeout(timer);if(run===generation){$('send').disabled=false;controller=null}}}
$('request-form').onsubmit=e=>{e.preventDefault();send()};$('disconnect').onclick=()=>{stop();$('status').textContent='Disconnected'};$('search').oninput=renderRoutes;$('compat').onchange=renderRoutes;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('example').textContent);$('copy').textContent='Copied'}catch{$('status').textContent='Select and copy the request example below.'}};$('next').onclick=()=>{const before=controls.find(c=>c.param.name==='before');if(before&&nextBefore){before.input.value=nextBefore;updateExample();send()}};
fetch('/openapi.json',{credentials:'omit'}).then(r=>{if(!r.ok)throw new Error('Schema HTTP '+r.status);return r.json()}).then(spec=>{for(const [path,ops] of Object.entries(spec.paths))for(const [method,op] of Object.entries(ops))if(['get','post'].includes(method))entries.push({path,method:method.toUpperCase(),op});choose(entries.find(e=>e.path==='/v2/users/handle/{handle}/theses')||entries[0])}).catch(error=>{$('routes').textContent='Could not load endpoints.';$('response').textContent=String(error)});
</script>
</body></html>
